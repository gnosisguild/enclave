[workspace]
resolver = "3"
msrv = "1.91.1"
members = ["app", "host", "methods", "types"]
exclude = ["methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
e3-support-app = { path = "./app" }
e3-support-host = { path = "./host" }
e3-user-program = { path = "./program" }
e3-support-types = { path = "./types" }
e3-fhe-params = { git = "https://github.com/theinterfold/interfold", rev = "f342b4ef0593a5e4cd94d0920bed9a90e8473504" }

methods = { path = "./methods" }
alloy-primitives = { version = "1.3", default-features = false, features = [
    "rlp",
    "serde",
    "std",
]}
alloy-sol-types = { version = "1.3" }
alloy-signer-local = { version = "1.0" }
anyhow = { version = "=1.0.98" }
actix-web = "=4.11.0"
bincode = { version = "=1.3.3" }
bytemuck = { version = "=1.25.0" }
env_logger = "=0.11.8"
hex = { version = "=0.4.3" }
log = { version = "=0.4.27" }
reqwest = { version = "=0.12.22", features = ["json"] }
risc0-build = { version = "=3.0.3", features = ["docker"] }
risc0-build-ethereum = { git = "https://github.com/risc0/risc0-ethereum", tag = "v3.0.0" }
risc0-ethereum-contracts = { git = "https://github.com/risc0/risc0-ethereum", tag = "v3.0.0" }
risc0-zkvm = { version = "=3.0.3" }
risc0-zkp = { version = "=3.0.2", default-features = false }
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
# The Interfold revision must match for all Interfold dependencies in this workspace.
#
# The Interfold crates below are pinned by revision rather than by path because this workspace is
# excluded from the root workspace on purpose (see the root Cargo.toml): a client must be able to
# build crates/support on its own, and the RISC Zero Docker build context root is crates/support,
# so anything outside that directory is unreachable from the guest build.
#
# The dependency therefore decides which compute-provider code the guest runs, and updates can
# change the image ID. Rebuild crates/support/contracts/ImageID.sol after dependency updates.
#
# The pinned Interfold crates use the same fhe.rs source as the host and program below.
# This keeps BFV parameters and ciphertext types consistent across the computation boundary.
fhe = { package = "fhe", git = "https://github.com/gnosisguild/fhe.rs", branch = "refactor/trbfv-synchronized-consolidation", features = ["experimental-mbfv", "threshold-decryption"] }
fhe-traits = { git = "https://github.com/gnosisguild/fhe.rs", branch = "refactor/trbfv-synchronized-consolidation" }
fhe-util = { git = "https://github.com/gnosisguild/fhe.rs", branch = "refactor/trbfv-synchronized-consolidation" }
e3-compute-provider = { git = "https://github.com/theinterfold/interfold", rev = "f342b4ef0593a5e4cd94d0920bed9a90e8473504" }
tokio = { version = "=1.46.1", features = ["full"] }
rand = { version = "=0.9.4" }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
boundless-market = { version = "=1.1.0" }
url = { version = "=2.5.4" }
dotenvy = { version = "=0.15.7" }

[profile.release]
debug = 1
lto = true
